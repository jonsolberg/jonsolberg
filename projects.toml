emoji = "🔁"
blurb = "Editor for the BOSS RC-500 Loop Station over its own USB port, in the browser or on Android: all 99 memories, ASSIGNs and system settings, loops (play, export, import), and a Direct mode that plays the pedal live from an on-screen copy of its panel, tempo as MIDI clock included. Experimental."
