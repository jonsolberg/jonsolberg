# Profile page for github.com/jonsolberg
#
# The README is rebuilt from this file plus live data from GitHub
# (descriptions, latest releases, last update) by .github/workflows/update.yml.
#
# New public repos show up by themselves under "New & other". To give one
# a nicer entry, add a [[project]] block for it with the right section.

site = "https://jonsolberg.se:8080"
kofi = "https://ko-fi.com/jonsolberg"

intro = """I make small, free apps and games: tools for musicians, a bread calculator, \
a tea timer, wallpapers and a few games you can play in the browser. \
The apps are open source under GPL v3."""

[[section]]
id = "music"
title = "🎸 For musicians"

[[section]]
id = "everyday"
title = "🍞 Everyday tools"

[[section]]
id = "games"
title = "🎮 Games"
note = "Play them in the browser on jonsolberg.se, or install the Android versions."

# --- For musicians -------------------------------------------------------

[[project]]
repo = "plektrum"
name = "Plektrum"
section = "music"
emoji = "🎸"
blurb = "A toolbox for string players: chords for guitar, ukulele, mandolin, banjo and bass, a tuner for fifteen instruments, progressions with backing, the circle of fifths, scales and a metronome."
platform = "Android"
links = [ ["Android app", "/Software/Plektrum.apk"] ]

[[project]]
repo = "tactus"
name = "Tactus"
section = "music"
emoji = "⌚"
blurb = "A metronome you feel instead of hear: buzzes the beat on your Garmin watch, harder on beat 1. Odd time signatures, tap tempo, colour or black-and-white screens."
platform = "Garmin Connect IQ"
links = [ ["fēnix 7 app", "https://github.com/jonsolberg/tactus/releases/latest/download/Tactus-fenix7.prg"], ["Install guide", "https://github.com/jonsolberg/tactus/blob/main/docs/INSTALL.md"] ]

[[project]]
repo = "strymoniridiumcontrol"
name = "Iridium Control"
section = "music"
emoji = "🎛️"
blurb = "Editor and preset library for the Strymon Iridium pedal. Turn the knobs on screen, keep 300 presets and save them to the pedal over USB or Bluetooth MIDI."
platform = "Android"
links = [ ["Android app", "/Software/IridiumControl.apk"] ]

[[project]]
repo = "wamplerterraformcontrol"
name = "Terraform Control"
section = "music"
emoji = "🌀"
blurb = "Editor and preset library for the Wampler Terraform modulation pedal: all 11 effects, knobs on screen, tempo and 128 presets over USB or Bluetooth MIDI."
platform = "Android"
links = [ ["Android app", "/Software/TerraformControl.apk"] ]

[[project]]
repo = "hxstompforandroid"
name = "HX Stomp Control"
section = "music"
emoji = "🧪"
blurb = "Early, experimental step towards an Android HX Edit for the Line 6 HX Stomp: browse presets bank by bank over USB and switch with a tap."
platform = "Android · experimental"
links = [ ["Android app (test)", "https://github.com/jonsolberg/hxstompforandroid/releases/latest/download/HXStompControl.apk"] ]

