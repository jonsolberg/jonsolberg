# Every hour: the latest app versions and the merged per-day updates for jonsolberg.se (site/updates.json).
# Copyright (C) 2026 Jon Solberg - GPL v3 or later, see LICENSE.

name: Website data

on:
  schedule:
    - cron: "41 * * * *"
  push:
    branches: [main]
    paths: [tools/site_updates.py, .github/workflows/site-data.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site/updates.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/site_updates.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain site)" ]; then
            git config user.name "Jon Solberg"
            git config user.email "jonsolberg@users.noreply.github.com"
            git add site
            git commit -qm "Website data"
            git pull -q --rebase && git push -q
          fi
