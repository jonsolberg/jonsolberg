# Rebuilds the profile README every day, when projects.toml changes,
# or by hand (Actions -> Update profile -> Run workflow).
# Copyright (C) 2026 Jon Solberg - GPL v3 or later, see LICENSE.

name: Update profile

on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths: [projects.toml, generate.py, .github/workflows/update.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build README
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python generate.py
      - name: Commit if changed
        run: |
          if git diff --quiet README.md 2>/dev/null && git ls-files --error-unmatch README.md >/dev/null 2>&1; then
            echo "No changes"; exit 0
          fi
          git config user.name "Jon Solberg"
          git config user.email "jonsolberg@users.noreply.github.com"
          git add README.md
          git commit -m "Update project overview"
          git push
